# The one place AutoBridge's version is set.
#
# app/build.gradle.kts reads this file for defaultConfig.versionName/versionCode, and
# scripts/sync-version.sh copies the values into README.md. Nothing else should hold a literal
# version number.
#
# Bump it with the script, which also increments versionCode and syncs the README:
#
#   ./scripts/set-version.sh 0.5.0     # explicit
#   ./scripts/set-version.sh patch     # 0.4.12 -> 0.4.13
#   ./scripts/set-version.sh minor     # 0.4.12 -> 0.5.0
#   ./scripts/set-version.sh --show    # print what is set now
#
# Or override a single build without editing anything (Gradle property beats env beats this file):
#
#   ./gradlew assembleSafeRelease -PversionName=0.5.0-rc1 -PversionCode=27
#   AUTOBRIDGE_VERSION_NAME=0.5.0-rc1 ./gradlew assembleSafeRelease
#
# versionName is what the user sees and what the in-app update check compares against a GitHub
# release tag, so keep it `major.minor.patch` (an optional `-rc1`-style suffix is understood and
# ranks below the plain release). versionCode must increase on every build Play or a phone is
# asked to install over an older one.
versionName=0.4.57
versionCode=71
