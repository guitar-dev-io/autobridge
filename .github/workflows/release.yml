name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      all_flavors:
        description: 'Also build the personal AAB and the lab APK'
        type: boolean
        default: false

permissions:
  contents: write  # needed to create a GitHub Release and attach the artifacts

# Only the personal APK is built and published by default: it is the one file anyone installs.
# The personal AAB and the lab APK are still wired up below; tick "all_flavors" on a manual run,
# or change the 'false' here to 'true', to build and publish them again.
env:
  ALL_FLAVORS: ${{ github.event.inputs.all_flavors == 'true' && 'true' || 'false' }}

jobs:
  release:
    name: Build + publish personal release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # :whisper builds whisper.cpp from the submodule at whisper/third_party/whisper.cpp.
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Explicit, because the action's own default is "tools platform-tools" and the obsolete
          # "tools" package is gone from the SDK repository: sdkmanager answers "Failed to find
          # package 'tools'" and exits 1, failing this step before a single Gradle task runs.
          # Nothing else is listed because AGP downloads the platform and build-tools it wants, and
          # the action has accepted the licenses by this point.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A tag push is the release trigger; version.properties is what the build actually stamps
      # into the APK. If they disagree the release is named one thing and installs as another, and
      # the in-app update check compares the running build against the wrong number — so stop
      # before anything is published.
      - name: Check the tag matches version.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          build_version="$(./gradlew --no-daemon -q :app:printVersion | tail -n1)"
          name="${build_version%% *}"
          echo "tag=$tag  version.properties=$build_version"
          if [ "$tag" != "$name" ]; then
            echo "::error::Tag v$tag does not match versionName $name in version.properties." \
                 "Run ./scripts/set-version.sh $tag, commit, then re-tag."
            exit 1
          fi

      # Signing is opt-in. If RELEASE_KEYSTORE_BASE64 is set, decode it to keystore/release.jks
      # and write keystore/release.properties — the exact file app/build.gradle.kts reads to wire
      # the `release` signing config. If the secret is absent, skip: the build still runs and
      # produces an unsigned APK rather than failing on a missing keystore.
      - name: Prepare signing material
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No signing secrets found — building UNSIGNED release AAB + APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          # storeFile is resolved by rootProject.file(...) in app/build.gradle.kts, so a repo-root
          # relative path is correct here.
          cat > keystore/release.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # personal: primary sideload flavor (pulls in libs/aauto.aar, not Play-accepted) -> AAB + APK.
      # lab:      sideload-only flavor, same dependencies -> APK only; nothing consumes a lab .aab.
      # One build pass; every variant shares the same signing config.
      #   AAB -> app/build/outputs/bundle/<flavor>Release/*.aab
      #   APK -> app/build/outputs/apk/<flavor>/release/*.apk
      - name: Build release
        run: |
          set -euo pipefail
          tasks="assemblePersonalRelease"
          if [ "$ALL_FLAVORS" = "true" ]; then
            tasks="bundlePersonalRelease $tasks assembleLabRelease"
          fi
          echo "Building: $tasks"
          ./gradlew --no-daemon $tasks

      # Scrub decoded signing material. The runner is ephemeral, but do not depend on that, and
      # keep it out of any later step's artifact upload.
      - name: Scrub signing material
        if: always()
        run: rm -f keystore/release.jks keystore/release.properties

      # The R8 mapping file for each release variant. Nothing here goes through Play, so there is
      # no deobfuscation service reading the copy AGP embeds in the .aab: a stack trace from either
      # flavor is unreadable without the matching mapping.txt, and R8 output is not reproducible
      # from a later build, so the only chance to keep it is now.
      #
      # Kept as a workflow artifact rather than attached to the GitHub Release: these are tens of
      # MB each, and they are a debugging aid for whoever is holding the crash, not part of the
      # download. Retrace with
      #   $ANDROID_HOME/cmdline-tools/latest/bin/retrace mapping.txt trace.txt
      - name: Upload R8 mapping files
        uses: actions/upload-artifact@v4
        with:
          name: autobridge-release-mapping
          path: |
            app/build/outputs/mapping/personalRelease/mapping.txt
            app/build/outputs/mapping/labRelease/mapping.txt
          if-no-files-found: error

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autobridge-release
          path: |
            app/build/outputs/bundle/personalRelease/*.aab
            app/build/outputs/apk/personal/release/*.apk
            app/build/outputs/apk/lab/release/*.apk
          if-no-files-found: error

      # Only publish a GitHub Release for an actual tag push, not for manual dispatch on a branch.
      # A version with a suffix (0.4.58-rc2) is published as a pre-release: the in-app update check
      # reads /releases/latest, which skips pre-releases, so only people who go looking get it.
      - name: Publish GitHub Release (personal APK)
        if: startsWith(github.ref, 'refs/tags/') && env.ALL_FLAVORS != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/personal/release/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Publish GitHub Release (all flavors)
        if: startsWith(github.ref, 'refs/tags/') && env.ALL_FLAVORS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/personalRelease/*.aab
            app/build/outputs/apk/personal/release/*.apk
            app/build/outputs/apk/lab/release/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
