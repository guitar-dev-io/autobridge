org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# On-device subtitle translation, and with it the only two heavyweight dependencies in the build:
# ML Kit Translate and ONNX Runtime (the Opus-MT/Marian engine, a native .so per ABI). Off by
# default: the build ships without either library and the subtitle track still decodes and
# renders, only untranslated. Set to true to compile the feature in, or override one build with
# `-Pautobridge.subtitleTranslation=true` / `AUTOBRIDGE_SUBTITLE_TRANSLATION=true`.
autobridge.subtitleTranslation=false
