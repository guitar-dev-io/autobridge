org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# On-device subtitle translation, and with it the only two heavyweight dependencies in the build:
# ML Kit Translate and ONNX Runtime (the Opus-MT/Marian engine, a native .so per ABI). Set to
# false to build without either library — the subtitle track still decodes and renders, only
# untranslated — or override one build with
# `-Pautobridge.subtitleTranslation=false` / `AUTOBRIDGE_SUBTITLE_TRANSLATION=false`.
autobridge.subtitleTranslation=true
