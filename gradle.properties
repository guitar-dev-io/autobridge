org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# On-device subtitle translation, and with it the only two heavyweight dependencies in the build:
# ML Kit Translate and ONNX Runtime (the Opus-MT/Marian engine, a native .so per ABI). Off by
# default: the build ships without either library and the subtitle track still decodes and
# renders, only untranslated. Set to true to compile the feature in, or override one build with
# `-Pautobridge.subtitleTranslation=true` / `AUTOBRIDGE_SUBTITLE_TRANSLATION=true`.
autobridge.subtitleTranslation=false

# Embedded libVLC playback engine, offered beside the built-in Media3 player (Fermata-style "pick
# which engine plays your media"). The whole cost is the native payload: libvlc-all ships an
# uncompressed .so set per ABI (tens of MB across arm64-v8a + armeabi-v7a). Off by default: the
# build resolves no org.videolan artifact, packages no VLC .so, does not compile the VLC engine
# classes, and the Settings choice is hidden. Set to true to compile the engine in, or override
# one build with `-Pautobridge.vlc=true` / `AUTOBRIDGE_VLC=true`.
autobridge.vlc=false
